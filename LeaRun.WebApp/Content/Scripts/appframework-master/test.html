<!DOCTYPE html>
<!--HTML5 doctype-->
<html>

<head>

    <title>List View Template</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <META HTTP-EQUIV="Pragma" CONTENT="no-cache">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" type="text/css" href="build/icons.css" />
    <link rel="stylesheet" type="text/css" href="build/af.ui.css" />
    <script src="build/jquery.min.js"></script>
    <script src="build/fastclick.min.js"></script>
    <script type="text/javascript" charset="utf-8" src="build/appframework.ui.min.js"></script>


    <script type="text/javascript">

        function showPopup2() {
            $.afui.popup({
                title: "Alert! Alert!",
                message: "This is a test of the emergency alert system!! Don't PANIC!",
                cancelText: "Cancel me",
                cancelCallback: function () {
                    console.log("cancelled");
                },
                doneText: "I'm done!",
                doneCallback: function () {
                    console.log("Done for!");
                },
                cancelOnly: false
            });
        }

        function showPopup3() {
            $.afui.popup({
                title: "填写完工信息",
                message: "完工数量: <input type='text' class='af-ui-forms'><br>备注: <input type='text' class='af-ui-forms' style='webkit-text-security:disc'>",
                cancelText: "取消",
                cancelCallback: function () { },
                doneText: "确定",
                doneCallback: function (obj) {
                    console.log(obj);
                },
                cancelOnly: false
            });
        }
    </script>
</head>

<body>
    <div id="splashscreen" class='ui-loader heavy'>
        App Framework - List View
        <br>
        <br>
        <span class='ui-icon ui-icon-loading spin'></span>
        <h1>Starting app</h1>
    </div>

    <div class="view" id="mainview">
        <header>
            <h1>List View Example</h1>
        </header>

        <div class="pages">
            <div data-left-drawer="left" class="panel" id="main" data-title="Main" data-selected="true">
                <p id='main_info'>Welcome to the kitchen sink demo for App Framework UI. Here you will find samples of how to use the App Framework UI. Please select an option from below.</p>
                <br>
                <a class="button" onClick="showPopup3()">HTML markup</a>
            </div>


        </div>

        <!--Footer to add tabs if desired-->
        <footer>
        </footer>
    </div>


</body>

</html>
