<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ko" lang="ko">
<head>
<title>Javascript 二维码生成库：QRCode</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<script type="text/javascript" src="http://static.runoob.com/assets/jquery/2.0.3/jquery.min.js"></script>
<script type="text/javascript" src="http://static.runoob.com/assets/qrcode/qrcode.min.js"></script>
</head>
<body>
    <table>
        <tr>
            <td rowspan="2" colspan="2">
                <div id="qrcode" style="width:100px; height:100px; margin-top:15px;"></div>
                <button class="md-qrcode-btn" onclick="downloadIamge()">下载</button>
            </td>
        </tr>
    </table>

<script type="text/javascript">
    var qrcode = new QRCode($("#qrcode")[0], {
	width : 100,
	height: 100
});
    qrcode.makeCode("asdf卡卡");


    //下载二维码
    function downloadIamge() {
        var imgs = document.getElementById("qrcode").getElementsByTagName("img")
        var a = document.createElement('a')
        a.download = 'xds' + new Date().getTime() || '下载图片名称'
        a.href = imgs[0].src
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }


</script>
</body>
</html>
